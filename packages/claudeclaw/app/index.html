<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="manifest" href="manifest.json" />
    <title>Claudeclaw</title>
    <style>
      :root {
        --bg: #0f0f0f;
        --surface: #1a1a1a;
        --surface2: #242424;
        --border: #333;
        --text: #e8e8e8;
        --text-dim: #888;
        --accent: #c084fc;
        --accent-dim: #7c3aed;
        --green: #4ade80;
        --yellow: #facc15;
        --red: #f87171;
        --radius: 12px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }
      .header h1 {
        font-size: 18px;
        font-weight: 600;
      }
      .header h1 span {
        color: var(--accent);
      }
      .header-actions {
        display: flex;
        gap: 8px;
      }
      .header-actions button {
        background: none;
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .header-actions button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* Main layout */
      .main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      /* Chat panel */
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: var(--radius);
        font-size: 15px;
        line-height: 1.5;
        word-wrap: break-word;
        white-space: pre-wrap;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--accent-dim);
        color: white;
        border-bottom-right-radius: 4px;
      }
      .msg.agent {
        align-self: flex-start;
        background: var(--surface2);
        border-bottom-left-radius: 4px;
      }
      .msg.system {
        align-self: center;
        background: none;
        color: var(--text-dim);
        font-size: 13px;
        text-align: center;
      }

      /* Input area */
      .input-area {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .input-area textarea {
        flex: 1;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        padding: 10px 14px;
        font-size: 15px;
        font-family: var(--font);
        resize: none;
        outline: none;
        max-height: 120px;
      }
      .input-area textarea:focus {
        border-color: var(--accent);
      }
      .input-area button {
        background: var(--accent);
        border: none;
        color: white;
        padding: 10px 16px;
        border-radius: var(--radius);
        font-size: 15px;
        cursor: pointer;
        font-weight: 600;
        flex-shrink: 0;
      }
      .input-area button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Activity panel */
      .activity {
        width: 280px;
        border-left: 1px solid var(--border);
        background: var(--surface);
        overflow-y: auto;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
      }
      .activity-header {
        padding: 12px 16px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--border);
      }
      .activity-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .activity-item {
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12px;
        color: var(--text-dim);
        background: var(--surface2);
      }
      .activity-item .tool-name {
        color: var(--accent);
        font-weight: 600;
      }
      .activity-item .timestamp {
        float: right;
        font-size: 10px;
      }
      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .status-dot.running {
        background: var(--yellow);
        animation: pulse 1s infinite;
      }
      .status-dot.idle {
        background: var(--green);
      }
      .status-dot.off {
        background: var(--red);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* Setup screen */
      .setup {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        padding: 32px;
        text-align: center;
        gap: 24px;
      }
      .setup h2 {
        font-size: 28px;
      }
      .setup h2 span {
        color: var(--accent);
      }
      .setup p {
        color: var(--text-dim);
        max-width: 400px;
        line-height: 1.6;
      }
      .setup input {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        padding: 12px 16px;
        font-size: 15px;
        width: 100%;
        max-width: 400px;
        outline: none;
        font-family: var(--font);
      }
      .setup input:focus {
        border-color: var(--accent);
      }
      .setup button {
        background: var(--accent);
        border: none;
        color: white;
        padding: 12px 24px;
        border-radius: var(--radius);
        font-size: 16px;
        cursor: pointer;
        font-weight: 600;
      }
      .setup .error {
        color: var(--red);
        font-size: 13px;
      }
      .setup .step {
        color: var(--text-dim);
        font-size: 13px;
      }

      /* Mobile: hide activity panel */
      @media (max-width: 640px) {
        .activity {
          display: none;
        }
        .activity.show {
          display: flex;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          width: 100%;
          z-index: 10;
        }
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Setup Screen -->
    <div id="setup-screen" class="setup">
      <h2><span>Claudeclaw</span></h2>
      <p>
        Your personal AI assistant, running on Anthropic's cloud. Always on. Gets smarter over time.
      </p>
      <input
        id="api-key-input"
        type="password"
        placeholder="Paste your Anthropic API key (sk-ant-...)"
      />
      <button id="setup-btn" onclick="startSetup()">Connect</button>
      <div id="setup-status" class="step"></div>
      <div id="setup-error" class="error"></div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
      <div class="header">
        <h1><span>Claudeclaw</span></h1>
        <div class="header-actions">
          <button onclick="toggleActivity()">Activity</button>
          <button onclick="newSession()">New Chat</button>
          <button onclick="logout()">Settings</button>
        </div>
      </div>
      <div class="main">
        <div class="chat">
          <div class="messages" id="messages"></div>
          <div class="input-area">
            <textarea
              id="input"
              rows="1"
              placeholder="Message Claudeclaw..."
              onkeydown="handleKey(event)"
              oninput="autoResize(this)"
            ></textarea>
            <button id="send-btn" onclick="sendMessage()">Send</button>
          </div>
        </div>
        <div class="activity" id="activity-panel">
          <div class="activity-header">
            <span class="status-dot off" id="status-dot"></span>Activity
          </div>
          <div class="activity-list" id="activity-list"></div>
        </div>
      </div>
    </div>

    <script>
      const API = "https://api.anthropic.com/v1";
      const BETA = "managed-agents-2026-04-01";
      const API_VER = "2023-06-01";
      const SYSTEM_PROMPT = `You are Claudeclaw, a personal AI assistant that lives in the cloud. You are always available, highly capable, and you get better over time.

Your core traits:
- You are proactive: anticipate what the user needs next.
- You are thorough: when given a task, complete it fully.
- You are honest: if you're unsure, say so.
- You remember: pay attention to preferences, patterns, and past requests.
- You are persistent: for long-running tasks, keep working until done.

You have a sandboxed cloud container with bash, file operations, web browsing, and code execution. Use these tools freely.

After completing complex tasks, note key learnings and pitfalls. When you learn something new about the user, mention it briefly.`;

      // State
      let state = {
        apiKey: null,
        agentId: null,
        envId: null,
        sessionId: null,
        agentVersion: null,
      };

      function save() {
        localStorage.setItem("claudeclaw", JSON.stringify(state));
      }
      function load() {
        const s = localStorage.getItem("claudeclaw");
        if (s) {
          state = JSON.parse(s);
          return true;
        }
        return false;
      }

      // API helpers
      async function api(method, path, body) {
        const res = await fetch(`${API}${path}`, {
          method,
          headers: {
            "Content-Type": "application/json",
            "x-api-key": state.apiKey,
            "anthropic-version": API_VER,
            "anthropic-beta": BETA,
          },
          ...(body ? { body: JSON.stringify(body) } : {}),
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`${res.status}: ${text}`);
        }
        if (res.status === 204) return null;
        return res.json();
      }

      async function streamEvents(sessionId, onEvent) {
        const res = await fetch(`${API}/sessions/${sessionId}/stream`, {
          headers: {
            Accept: "text/event-stream",
            "x-api-key": state.apiKey,
            "anthropic-version": API_VER,
            "anthropic-beta": BETA,
          },
        });
        if (!res.ok) throw new Error(`Stream error: ${res.status}`);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let evtType = "",
          evtData = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop() || "";
          for (const line of lines) {
            if (line.startsWith("event: ")) evtType = line.slice(7).trim();
            else if (line.startsWith("data: ")) evtData += line.slice(6);
            else if (line === "" && evtData) {
              try {
                onEvent(evtType, JSON.parse(evtData));
              } catch {}
              evtType = "";
              evtData = "";
            }
          }
        }
      }

      // Setup
      async function startSetup() {
        const keyInput = document.getElementById("api-key-input");
        const statusEl = document.getElementById("setup-status");
        const errorEl = document.getElementById("setup-error");
        const btn = document.getElementById("setup-btn");

        const key = keyInput.value.trim();
        if (!key) {
          errorEl.textContent = "Please enter your API key";
          return;
        }

        state.apiKey = key;
        btn.disabled = true;
        errorEl.textContent = "";

        try {
          statusEl.textContent = "Creating your agent on Anthropic's cloud...";
          const agent = await api("POST", "/agents", {
            name: "Claudeclaw",
            model: "claude-sonnet-4-6",
            system: SYSTEM_PROMPT,
            tools: [{ type: "agent_toolset_20260401" }],
          });
          state.agentId = agent.id;
          state.agentVersion = agent.version;

          statusEl.textContent = "Setting up cloud environment...";
          const env = await api("POST", "/environments", {
            name: "claudeclaw-env",
            config: {
              type: "cloud",
              packages: { pip: ["pandas", "numpy", "requests", "beautifulsoup4", "matplotlib"] },
              networking: { type: "unrestricted" },
            },
          });
          state.envId = env.id;

          save();
          statusEl.textContent = "Ready!";
          showApp();
        } catch (e) {
          errorEl.textContent = e.message;
          btn.disabled = false;
          statusEl.textContent = "";
        }
      }

      // App
      function showApp() {
        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        document.getElementById("input").focus();
        addSystemMessage("Claudeclaw is ready. Your agent runs on Anthropic's cloud.");
      }

      async function newSession() {
        state.sessionId = null;
        save();
        document.getElementById("messages").innerHTML = "";
        document.getElementById("activity-list").innerHTML = "";
        setStatus("off");
        addSystemMessage("New conversation started.");
      }

      function logout() {
        if (confirm("Reset Claudeclaw? This will clear your API key and agent config.")) {
          localStorage.removeItem("claudeclaw");
          location.reload();
        }
      }

      function toggleActivity() {
        document.getElementById("activity-panel").classList.toggle("show");
      }

      // Chat
      async function sendMessage() {
        const input = document.getElementById("input");
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        autoResize(input);
        addMessage("user", text);
        document.getElementById("send-btn").disabled = true;
        setStatus("running");

        try {
          // Create session if needed
          if (!state.sessionId) {
            const session = await api("POST", "/sessions", {
              agent: state.agentId,
              environment_id: state.envId,
              title: text.slice(0, 80),
            });
            state.sessionId = session.id;
            save();
          }

          // Send message
          await api("POST", `/sessions/${state.sessionId}/events`, {
            events: [{ type: "user.message", content: [{ type: "text", text }] }],
          });

          // Stream response
          let agentText = "";
          let agentEl = null;

          await streamEvents(state.sessionId, (type, data) => {
            if (type === "agent.message" || data.type === "agent.message") {
              const blocks = data.content || [];
              const newText = blocks
                .filter((b) => b.type === "text")
                .map((b) => b.text)
                .join("");
              if (newText) {
                agentText += newText;
                if (!agentEl) agentEl = addMessage("agent", "");
                agentEl.textContent = agentText;
                scrollToBottom();
              }
            } else if (type === "agent.tool_use" || data.type === "agent.tool_use") {
              addActivity(
                "tool",
                data.name || "tool",
                JSON.stringify(data.input || {}).slice(0, 80),
              );
            } else if (type === "agent.tool_result" || data.type === "agent.tool_result") {
              addActivity("result", "result", "completed");
            } else if (type === "session.status_idle" || data.type === "session.status_idle") {
              setStatus("idle");
            } else if (
              type === "session.status_terminated" ||
              data.type === "session.status_terminated"
            ) {
              setStatus("off");
              state.sessionId = null;
              save();
              addSystemMessage("Session ended. Next message starts a new one.");
            }
          });
        } catch (e) {
          addSystemMessage("Error: " + e.message);
          setStatus("off");
          // If session errored, reset it
          state.sessionId = null;
          save();
        }

        document.getElementById("send-btn").disabled = false;
        setStatus("idle");
      }

      // UI helpers
      function addMessage(role, text) {
        const el = document.createElement("div");
        el.className = `msg ${role}`;
        el.textContent = text;
        document.getElementById("messages").appendChild(el);
        scrollToBottom();
        return el;
      }

      function addSystemMessage(text) {
        addMessage("system", text);
      }

      function addActivity(type, name, detail) {
        const el = document.createElement("div");
        el.className = "activity-item";
        const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        el.innerHTML = `<span class="timestamp">${time}</span><span class="tool-name">${name}</span> ${detail || ""}`;
        const list = document.getElementById("activity-list");
        list.insertBefore(el, list.firstChild);
      }

      function setStatus(s) {
        const dot = document.getElementById("status-dot");
        dot.className = `status-dot ${s}`;
      }

      function scrollToBottom() {
        const el = document.getElementById("messages");
        el.scrollTop = el.scrollHeight;
      }

      function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      function autoResize(el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 120) + "px";
      }

      // Boot
      if (load() && state.apiKey && state.agentId) {
        showApp();
      } else {
        document.getElementById("setup-screen").classList.remove("hidden");
      }
    </script>
  </body>
</html>
